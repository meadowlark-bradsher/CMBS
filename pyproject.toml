[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmbs"
version = "0.1.0"
description = "Constraint Mask Belief System — externalized belief-state accounting for long-horizon agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Meadowlark Bradsher" },
]
keywords = [
    "belief-state",
    "agents",
    "hypothesis-elimination",
    "audit",
    "replay",
    "cmbs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.6",
]
tutorials = [
    "anthropic>=1.0",
    # httpx2 (the SDK's HTTP layer) uses Brotli's newer decompressor API but
    # does not require Brotli itself; an older Brotli already present in the
    # environment breaks response decoding with
    # "TypeError: process() takes no keyword arguments".
    "brotli>=1.2; platform_python_implementation == 'CPython'",
]

[tool.setuptools.packages.find]
include = ["cmbs*"]
exclude = ["tests*", "examples*", "tutorials*", "archive*", "docs*", "docs-site*", "docs-vault*", "docs-snapshots*"]

[tool.setuptools.package-data]
cmbs = ["adapters/*/kits/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "archive",
    "docs-snapshots",
    "docs-vault",
    "docs-site",
    "site",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
]
